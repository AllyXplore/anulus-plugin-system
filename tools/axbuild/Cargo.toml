[package]
name = "axbuild"
version = "1.0.0"
description = "AxAIHub 插件打包工具 - 命令行打包 .axext / .axex 插件"
authors = ["AllyXplore"]
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
zip = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
rand = "0.8"
base64 = "0.21"
hex = "0.4"
ed25519-compact = "2"